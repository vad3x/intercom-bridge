[package]
name = "intercom-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Universal domain logic, services, events, and port definitions for Intercom Bridge"

[dependencies]
log = "0.4"
embassy-sync = "0.8"
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
embassy-futures = "0.1"

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
embassy-time = { version = "0.5", features = ["std", "generic-queue-8"] }
portable-atomic = "1"
futures = "0.3"
