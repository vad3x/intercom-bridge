[package]
name = "intercom-firmware"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ESP32-C6 firmware composition root for Intercom Bridge"

[lib]
path = "src/lib.rs"

[[bin]]
name = "intercom-bridge"
path = "src/main.rs"
harness = false
test = false

[features]
default = ["esp32c6"]
esp32c6 = [
    "intercom-adapter-audio/esp32c6",
    "intercom-adapter-gpio/esp32c6",
    "intercom-adapter-matter/esp32c6",
    "rs-matter-embassy/trouble",
    "rs-matter-embassy/tcp",
    "rs-matter/large-buffers-4096",
    "intercom-adapter-webrtc/esp32c6",
    "edf-diag/esp32c6",
    "edf-gpio/esp32c6",
    "edf-ota/esp32c6",
    "dep:esp-wifi-sys-esp32c6",
    "esp-backtrace/esp32c6",
    "esp-hal/esp32c6",
    "esp-rtos/esp32c6",
    "esp-alloc/esp32c6",
    "esp-println/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-metadata-generated/esp32c6",
]
esp32s31 = [
    "intercom-adapter-audio/esp32s31",
    "intercom-adapter-gpio/esp32s31",
    "intercom-adapter-matter/esp32s31",
    "intercom-adapter-http/large-ota-buffers",
    "intercom-adapter-webrtc/esp32s31",
    "rs-matter-embassy/tcp",
    "rs-matter/large-buffers-4096",
    "edf-diag/esp32s31",
    "edf-gpio/esp32s31",
    "edf-ota/esp32s31",
    "dep:esp-wifi-sys-esp32s31",
    "esp-backtrace/esp32s31",
    "esp-hal/esp32s31",
    "esp-rtos/esp32s31",
    "esp-alloc/esp32s31",
    "esp-println/esp32s31",
    "esp-bootloader-esp-idf/esp32s31",
    "esp-metadata-generated/esp32s31",
]
esp32s3 = [
    "intercom-adapter-audio/esp32s3",
    "intercom-adapter-gpio/esp32s3",
    "intercom-adapter-matter/esp32s3",
    "intercom-adapter-http/large-ota-buffers",
    "intercom-adapter-webrtc/esp32s3",
    "rs-matter-embassy/trouble",
    "rs-matter-embassy/tcp",
    "rs-matter/large-buffers-4096",
    "edf-diag/esp32s3",
    "edf-gpio/esp32s3",
    "edf-ota/esp32s3",
    "edf-ota/psram",
    "dep:esp-wifi-sys-esp32s3",
    "esp-backtrace/esp32s3",
    "esp-hal/esp32s3",
    "esp-rtos/esp32s3",
    "esp-alloc/esp32s3",
    "esp-println/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-metadata-generated/esp32s3",
    "led-smartled",
    "esp-hal-smartled/esp32s3",
]
bench-talk-loopback = [
    "intercom-media/bench-talk-loopback",
    "intercom-adapter-audio/bench-talk-loopback",
    "intercom-adapter-http/bench-talk-loopback",
]
devkit = ["esp32c6", "flash-4mb", "led-smartled", "esp-hal-smartled/esp32c6", "ota-disabled"]
flash-4mb = []
led-smartled = ["dep:esp-hal-smartled", "dep:smart-leds"]
ota-disabled = []
dummy-persist = []

[dependencies]
intercom-core = { path = "../intercom-core" }
intercom-media = { workspace = true }
intercom-adapter-webrtc = { path = "../intercom-adapter-webrtc" }
intercom-adapter-audio = { path = "../intercom-adapter-audio", default-features = false }
edf-core = { workspace = true }
edf-diag = { workspace = true }
edf-gpio = { workspace = true }
edf-ota = { workspace = true }
edf-logger = { workspace = true }
intercom-adapter-http = { path = "../intercom-adapter-http" }
edf-matter = { workspace = true }
rs-matter = { workspace = true }
log = { workspace = true }
sha2 = { version = "=0.10.9", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
embassy-executor = { workspace = true }
embassy-futures = { workspace = true }
embassy-net = { workspace = true, features = ["dhcpv4", "dhcpv4-hostname"] }
embassy-sync = { workspace = true }
embassy-time = { workspace = true, features = ["generic-queue-8"] }
heapless = { workspace = true }
portable-atomic = { workspace = true, features = ["critical-section"] }
static_cell = { workspace = true }

[target.'cfg(target_os = "none")'.dependencies]
embedded-storage = { workspace = true }
embedded-storage-async = { workspace = true }
intercom-adapter-webrtc = { path = "../intercom-adapter-webrtc", default-features = false, features = ["matter-port"] }
intercom-adapter-gpio = { path = "../intercom-adapter-gpio", default-features = false }
intercom-adapter-matter = { path = "../intercom-adapter-matter", default-features = false }
esp-backtrace = { workspace = true, features = ["panic-handler", "println", "custom-halt"] }
esp-hal = { workspace = true, features = ["log-04", "unstable", "exception-handler"] }
esp-radio = { workspace = true, default-features = false, features = ["log-04", "unstable"] }
esp-rtos = { workspace = true, features = ["esp-radio", "embassy"] }
esp-alloc = { workspace = true }
esp-println = { workspace = true, features = ["log-04"] }
esp-bootloader-esp-idf = { workspace = true, features = ["log-04"] }
esp-metadata-generated = { workspace = true }
rs-matter-embassy = { git = "https://github.com/sysgrok/rs-matter-embassy", rev = "0bf4ca5", default-features = false, features = ["esp", "embassy-net", "log", "rustcrypto", "kv-blob-store-8192", "max-im-buffers-4"] }
esp-wifi-sys-esp32c6 = { workspace = true, optional = true }
esp-wifi-sys-esp32s31 = { version = "=0.3.0", optional = true }
esp-wifi-sys-esp32s3 = { version = "=0.3.0", optional = true }
esp-hal-smartled = { workspace = true, optional = true }
smart-leds = { workspace = true, optional = true }

[dev-dependencies]
embassy-executor = { workspace = true, features = ["platform-std", "executor-thread"] }
critical-section = { workspace = true, features = ["std"] }
futures = { workspace = true }

[build-dependencies]
edf-build = { workspace = true }
