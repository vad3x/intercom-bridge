[package]
name = "intercom-adapter-http"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-net = { version = "0.9", features = ["tcp", "proto-ipv4", "medium-ethernet"] }
embassy-time = { version = "0.5", default-features = false }
intercom-core = { path = "../intercom-core" }
log = "0.4"
serde-json-core = "0.6"

[build-dependencies]
flate2 = "1.0"

[dev-dependencies]
flate2 = "1.0"
serde_json = "1.0"
