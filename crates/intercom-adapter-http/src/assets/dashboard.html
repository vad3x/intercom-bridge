<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intercom Bridge</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --badge-bg: rgba(16, 185, 129, 0.15);
      --badge-text: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }
    .header-title {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #status-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--badge-bg);
      color: var(--badge-text);
      transition: all 0.3s ease;
    }
    nav.tabs {
      display: flex;
      gap: 8px;
      padding: 12px 24px 0;
      border-bottom: 1px solid var(--border);
      background: rgba(30, 41, 59, 0.5);
    }
    .tab-btn {
      padding: 10px 18px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    main {
      flex: 1;
      padding: 24px;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--card-bg);
      color: var(--text);
    }
    .btn:hover:not(:disabled) {
      background: #283548;
      border-color: #475569;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-action-ring {
      border-color: rgba(245, 158, 11, 0.4);
    }
    .btn-action-ring:hover:not(:disabled) {
      background: rgba(245, 158, 11, 0.15);
      border-color: var(--warning);
    }
    .btn-action-unlock {
      border-color: rgba(59, 130, 246, 0.4);
    }
    .btn-action-unlock:hover:not(:disabled) {
      background: rgba(59, 130, 246, 0.15);
      border-color: var(--primary);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .card-label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .card-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      word-break: break-word;
    }
    .logs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logs-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    #logs-pre {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.45;
      color: #cbd5e1;
      height: calc(100vh - 230px);
      min-height: 380px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid var(--border);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 1000;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">⚡ Intercom Bridge</div>
    <span id="status-badge">● Ready</span>
  </header>

  <nav class="tabs">
    <button id="tab-btn-overview" class="tab-btn active">Overview</button>
    <button id="tab-btn-logs" class="tab-btn">System Logs</button>
  </nav>

  <main>
    <section id="tab-overview" class="tab-content active">
      <div class="actions-bar">
        <button id="btn-ring" class="btn btn-action-ring">🔔 Emulate Ring</button>
        <button id="btn-unlock" class="btn btn-action-unlock">🔓 Trigger Unlock</button>
      </div>
      <div class="grid">
        <div class="card">
          <div class="card-label">Uptime</div>
          <div id="val-uptime" class="card-value">--</div>
        </div>
        <div class="card">
          <div class="card-label">Wi-Fi RSSI</div>
          <div id="val-rssi" class="card-value">--</div>
        </div>
        <div class="card">
          <div class="card-label">Active Slot</div>
          <div id="val-slot" class="card-value">--</div>
        </div>
        <div class="card">
          <div class="card-label">Free Heap</div>
          <div id="val-heap" class="card-value">--</div>
        </div>
        <div class="card">
          <div class="card-label">Ecosystem (Matter)</div>
          <div id="val-ecosystem" class="card-value">--</div>
        </div>
        <div class="card">
          <div class="card-label">Firmware Version</div>
          <div id="val-version" class="card-value">--</div>
        </div>
      </div>
    </section>

    <section id="tab-logs" class="tab-content">
      <div class="logs-header">
        <div class="card-label">Device System Console</div>
        <div class="logs-controls">
          <label class="checkbox-label">
            <input type="checkbox" id="chk-auto-refresh" checked>
            <span>Auto-refresh</span>
          </label>
          <button id="btn-copy-logs" class="btn" style="padding: 6px 12px; font-size: 0.85rem;">📋 Copy Logs</button>
          <button id="btn-clear-logs" class="btn" style="padding: 6px 12px; font-size: 0.85rem;">Clear</button>
        </div>
      </div>
      <pre id="logs-pre"></pre>
    </section>
  </main>

  <div id="toast"></div>

  <script>
    (function () {
      let activeTab = 'overview';
      let toastTimer = null;

      const badge = document.getElementById('status-badge');
      const valUptime = document.getElementById('val-uptime');
      const valRssi = document.getElementById('val-rssi');
      const valSlot = document.getElementById('val-slot');
      const valHeap = document.getElementById('val-heap');
      const valEcosystem = document.getElementById('val-ecosystem');
      const valVersion = document.getElementById('val-version');
      const logsPre = document.getElementById('logs-pre');
      const chkAutoRefresh = document.getElementById('chk-auto-refresh');
      const toast = document.getElementById('toast');

      const btnRing = document.getElementById('btn-ring');
      const btnUnlock = document.getElementById('btn-unlock');
      const btnCopyLogs = document.getElementById('btn-copy-logs');
      const btnClearLogs = document.getElementById('btn-clear-logs');

      const tabBtnOverview = document.getElementById('tab-btn-overview');
      const tabBtnLogs = document.getElementById('tab-btn-logs');
      const tabOverview = document.getElementById('tab-overview');
      const tabLogs = document.getElementById('tab-logs');

      function showToast(msg, isError) {
        if (!toast) return;
        toast.textContent = msg;
        toast.style.borderColor = isError ? 'var(--danger)' : 'var(--border)';
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
      }

      function switchTab(tab) {
        activeTab = tab;
        if (tab === 'overview') {
          tabBtnOverview.classList.add('active');
          tabBtnLogs.classList.remove('active');
          tabOverview.classList.add('active');
          tabLogs.classList.remove('active');
          fetchStatus();
        } else {
          tabBtnLogs.classList.add('active');
          tabBtnOverview.classList.remove('active');
          tabLogs.classList.add('active');
          tabOverview.classList.remove('active');
          fetchLogs();
        }
      }

      tabBtnOverview.addEventListener('click', () => switchTab('overview'));
      tabBtnLogs.addEventListener('click', () => switchTab('logs'));

      function debounceButton(btn) {
        btn.disabled = true;
        setTimeout(() => { btn.disabled = false; }, 2000);
      }

      function sendAction(endpoint, btn, successMsg) {
        debounceButton(btn);
        fetch(endpoint, { method: 'POST' })
          .then(res => {
            if (res.ok) {
              showToast(successMsg, false);
            } else {
              showToast('Action failed: ' + res.statusText, true);
            }
          })
          .catch(err => showToast('Network error: ' + err.message, true));
      }

      btnRing.addEventListener('click', () => sendAction('/api/action/ring', btnRing, '🔔 Ring emulated'));
      btnUnlock.addEventListener('click', () => sendAction('/api/action/unlock', btnUnlock, '🔓 Unlock triggered'));

      btnCopyLogs.addEventListener('click', () => {
        if (!logsPre.textContent) return;
        navigator.clipboard.writeText(logsPre.textContent)
          .then(() => showToast('Logs copied to clipboard', false))
          .catch(() => showToast('Failed to copy logs', true));
      });

      btnClearLogs.addEventListener('click', () => {
        logsPre.textContent = '';
        showToast('Console cleared', false);
      });

      function formatUptime(sec) {
        if (sec == null) return '--';
        const d = Math.floor(sec / 86400);
        const h = Math.floor((sec % 86400) / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        let str = '';
        if (d > 0) str += d + 'd ';
        if (h > 0 || d > 0) str += h + 'h ';
        str += m + 'm ' + s + 's';
        return str;
      }

      function formatHeap(freeBytes, totalBytes) {
        if (freeBytes == null) return '--';
        const freeKb = Math.round(freeBytes / 1024);
        if (totalBytes != null && totalBytes > 0) {
          const totalKb = Math.round(totalBytes / 1024);
          return freeKb + ' KB / ' + totalKb + ' KB';
        }
        return freeKb + ' KB';
      }

      function fetchStatus() {
        fetch('/api/status')
          .then(res => res.json())
          .then(data => {
            if (data.state) {
              badge.textContent = '● ' + data.state;
              if (data.state === 'Updating') {
                badge.style.background = 'rgba(245, 158, 11, 0.15)';
                badge.style.color = 'var(--warning)';
              } else if (data.state === 'Ringing') {
                badge.style.background = 'rgba(59, 130, 246, 0.15)';
                badge.style.color = 'var(--primary)';
              } else {
                badge.style.background = 'var(--badge-bg)';
                badge.style.color = 'var(--badge-text)';
              }
            }
            valUptime.textContent = formatUptime(data.uptime_sec);
            valRssi.textContent = data.wifi_rssi_dbm != null ? (data.wifi_rssi_dbm + ' dBm') : '--';
            valSlot.textContent = data.active_slot ? (data.active_slot + (data.slot_valid ? ' (valid)' : '')) : '--';
            valHeap.textContent = formatHeap(data.free_heap_bytes, data.total_heap_bytes);
            valEcosystem.textContent = (data.ecosystem_protocol || 'Matter') + ': ' + (data.ecosystem_paired ? 'Paired' : 'Unpaired');
            valVersion.textContent = 'v' + (data.version || '--') + (data.git_commit ? (' (' + data.git_commit + ')') : '');
          })
          .catch(() => {});
      }

      function fetchLogs() {
        fetch('/api/logs')
          .then(res => res.text())
          .then(text => {
            logsPre.textContent = text;
            logsPre.scrollTop = logsPre.scrollHeight;
          })
          .catch(() => {});
      }

      // Initial fetch
      fetchStatus();

      // Periodic polling: 3000ms
      setInterval(() => {
        if (document.visibilityState === 'hidden') return;
        if (activeTab === 'overview') {
          fetchStatus();
        } else if (activeTab === 'logs' && chkAutoRefresh && chkAutoRefresh.checked) {
          fetchLogs();
        }
      }, 3000);

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          if (activeTab === 'overview') fetchStatus();
          else if (activeTab === 'logs') fetchLogs();
        }
      });
    })();
  </script>
</body>
</html>
