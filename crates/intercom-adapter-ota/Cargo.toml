[package]
name = "intercom-adapter-ota"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Over-The-Air (OTA) update adapter for Intercom Bridge"

[dependencies]
intercom-core = { path = "../intercom-core" }
log = { workspace = true }
embassy-net = { workspace = true, features = ["tcp", "proto-ipv4", "medium-ethernet"] }
embassy-time = { workspace = true }
embassy-sync = { workspace = true }
ed25519-dalek = { workspace = true }

[target.'cfg(target_arch = "riscv32")'.dependencies]
esp-hal = { workspace = true, features = ["unstable", "esp32c6"] }

[dev-dependencies]
critical-section = { workspace = true, features = ["std"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-8"] }
futures = { workspace = true }
