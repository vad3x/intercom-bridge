[package]
name = "intercom-adapter-ota"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Over-The-Air (OTA) update adapter for Intercom Bridge"

[dependencies]
intercom-core = { path = "../intercom-core" }
log = "0.4"
embassy-net = { version = "0.9", features = ["tcp", "proto-ipv4", "medium-ethernet"] }
embassy-time = "0.5"
embassy-sync = "0.8"
ed25519-dalek = { version = "2", default-features = false, features = ["hazmat"] }

[target.'cfg(target_arch = "riscv32")'.dependencies]
esp-hal = { version = "~1.2", features = ["unstable", "esp32c6"] }

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
embassy-time = { version = "0.5", features = ["std", "generic-queue-8"] }
futures = "0.3"
