[package]
name = "intercom-adapter-matter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Smart Home Matter protocol adapter for Intercom Bridge"

[dependencies]
intercom-core = { path = "../intercom-core" }
edf-matter = { workspace = true }
log = { workspace = true }
portable-atomic = { workspace = true }
embassy-sync = { workspace = true }
embassy-futures = { workspace = true }
embassy-time = { workspace = true, features = ["generic-queue-8"] }
rs-matter = { workspace = true }
rs-matter-embassy = { path = "../../../rs-matter-embassy/rs-matter-embassy", default-features = false, features = ["esp", "trouble", "embassy-net", "dhcpv4-hostname", "log", "rustcrypto", "kv-blob-store-8192", "mld-v1-compat", "nd-learn-from-frames"] }
esp-radio = { workspace = true, features = ["ble", "coex", "log-04", "unstable", "esp32c6"] }
esp-hal = { workspace = true, features = ["log-04", "unstable", "esp32c6"] }
esp-rtos = { workspace = true, features = ["esp-radio", "embassy", "esp32c6"] }
esp-alloc = { workspace = true }
embedded-storage = { workspace = true }
embedded-storage-async = { workspace = true }
static_cell = { workspace = true }
tinyrlibc = { workspace = true, features = ["utoa", "strtoul"] }
