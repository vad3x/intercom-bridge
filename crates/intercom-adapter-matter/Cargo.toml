[package]
name = "intercom-adapter-matter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Smart Home Matter protocol adapter for Intercom Bridge"

[features]
default = ["esp32c6"]
esp32c6 = [
    "esp-radio/esp32c6",
    "esp-radio/ble",
    "esp-radio/coex",
    "esp-hal/esp32c6",
    "esp-rtos/esp32c6",
    "esp-alloc/esp32c6",
    "rs-matter-embassy/trouble",
    "rs-matter-embassy/tcp",
    "rs-matter/large-buffers-4096",
]
esp32s31 = [
    "esp-radio/esp32s31",
    "esp-radio/wifi",
    "esp-hal/esp32s31",
    "esp-rtos/esp32s31",
    "esp-alloc/esp32s31",
    "rs-matter-embassy/tcp",
    "rs-matter/large-buffers-4096",
]
esp32s3 = [
    "esp-radio/esp32s3",
    "esp-radio/ble",
    "esp-radio/coex",
    "esp-hal/esp32s3",
    "esp-rtos/esp32s3",
    "esp-alloc/esp32s3",
    "rs-matter-embassy/trouble",
    "rs-matter-embassy/tcp",
    "rs-matter/large-buffers-4096",
]

[dependencies]
intercom-core = { path = "../intercom-core" }
heapless = { workspace = true }
edf-matter = { workspace = true }
log = { workspace = true }
portable-atomic = { workspace = true }
embassy-sync = { workspace = true }
embassy-futures = { workspace = true }
embassy-time = { workspace = true, features = ["generic-queue-8"] }
rs-matter = { workspace = true }
rs-matter-embassy = { path = "../../../rs-matter-embassy/rs-matter-embassy", default-features = false, features = ["esp", "embassy-net", "enet-extra-sockets-4", "log", "rustcrypto", "kv-blob-store-8192", "mld-v1-compat", "nd-learn-from-frames", "max-im-buffers-4"] }
esp-radio = { workspace = true, default-features = false, features = ["log-04", "unstable"] }
esp-hal = { workspace = true, features = ["log-04", "unstable"] }
esp-rtos = { workspace = true, features = ["esp-radio", "embassy"] }
esp-alloc = { workspace = true }
embedded-storage = { workspace = true }
embedded-storage-async = { workspace = true }
static_cell = { workspace = true }
tinyrlibc = { workspace = true, features = ["utoa", "strtoul"] }
rand_core = "0.9"
