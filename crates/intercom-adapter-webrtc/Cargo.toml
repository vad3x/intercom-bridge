[package]
name = "intercom-adapter-webrtc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bare-metal no_std fixed-point Opus 16 kHz SILK and single-port WebRTC Audio Media Engine"

[dependencies]
aes = { version = "0.8", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
crc32fast = { version = "1.4", default-features = false }
ctr = { version = "0.9", default-features = false }
embassy-futures = { workspace = true }
embassy-net = { workspace = true, features = ["proto-ipv4", "proto-ipv6", "udp", "medium-ethernet"] }
embassy-sync = { workspace = true }
embassy-time = { workspace = true }
heapless = { workspace = true }
hmac = { version = "0.12", default-features = false }
intercom-core = { path = "../intercom-core" }
intercom-media = { path = "../intercom-media" }
log = { workspace = true }
portable-atomic = { workspace = true }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
critical-section = { workspace = true, features = ["std"] }
