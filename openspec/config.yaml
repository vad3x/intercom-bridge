schema: spec-driven

# Project context
# Constraints and architectural rules that guide OpenSpec artifacts and workflows.
context: |
  Architecture:
  - Hexagonal Architecture (Ports & Adapters) virtual workspace.
  - crates/intercom-core is pure no_std with zero async or runtime dependencies. All business logic lives in deterministic state machines (IntercomStateMachine).
  - Edge adapters (intercom-adapter-gpio, intercom-adapter-matter, intercom-adapter-http) implement outbound port traits or drive Inbound Command Handles (AccessControllerHandle).
  - Target hardware: ESP32-C6 (RISC-V riscv32imac-unknown-none-elf) running the Embassy async runtime.

  OTA & System Safety:
  - Dual-bank A/B partition layout (ota_0 / ota_1). Updates stream exclusively into the inactive slot; the running slot is never touched during OTA.
  - Cryptographic verification uses Ed25519 before updating otadata. Bootloader watchdog automatically rolls back if newly booted firmware fails self-validation.

  Matter Protocol:
  - Endpoint 1: Audio Doorbell (0x0141) with Switch, Chime, and WebRTC streaming. Audio signaling never unlocks the door.
  - Endpoint 2: Door Lock (0x000A) for strike unlock actuation.
  - In rs-matter cluster definitions, always prefix with_attrs with 'system;' to preserve global system attributes (0xFFF8-0xFFFD).
